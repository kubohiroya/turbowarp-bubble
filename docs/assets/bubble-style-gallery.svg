<text x="1428" y="668" text-anchor="middle" class="small">文字だけ表示</text>
        <text x="1428" y="688" text-anchor="middle" class="small">fill／border色は別指定</text>
      </g>
  <text x="32" y="724" class="small">orientation／segmentsは指定せず、幅・フォント・改行後の行数から外形寸法を自動計算します。</text>
