          <text x="866" y="361" class="body">口パク</text>
          <text x="1144" y="361" text-anchor="end" class="body" style="font-weight:700">停止</text>
        </g>
<g transform="translate(0 70)">
          <circle cx="848" cy="355" r="7" fill="#c7ccd8"/>
          <text x="866" y="361" class="body">次へ</text>
