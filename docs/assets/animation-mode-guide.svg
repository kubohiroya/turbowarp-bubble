             <path d="M 691 254 l 18 0 l -9 12 z" fill="#ff6680"/>
             <path d="M 691 273 l 18 0 l -9 12 z" fill="#d94b68"/>
           </g>
  </g>
    <g transform="translate(0 0)">
          <circle cx="452" cy="355" r="7" fill="#20a464"/>
          <text x="470" y="361" class="body">目パチ</text>
          <text x="748" y="361" text-anchor="end" class="body" style="font-weight:700">実行</text>
        </g>
<g transform="translate(0 35)">
          <circle cx="452" cy="355" r="7" fill="#c7ccd8"/>
          <text x="470" y="361" class="body">口パク</text>
          <text x="748" y="361" text-anchor="end" class="body" style="font-weight:700">停止</text>
        </g>
<g transform="translate(0 70)">
          <circle cx="452" cy="355" r="7" fill="#20a464"/>
          <text x="470" y="361" class="body">次へ</text>
          <text x="748" y="361" text-anchor="end" class="body" style="font-weight:700">ループ</text>
        </g>
  </g>
  <g>
    <rect x="816" y="86" width="360" height="382" rx="20" fill="#ffffff" stroke="#d9deea" stroke-width="2"/>
    <rect x="836" y="106" width="170" height="34" rx="17" fill="#e8ebf2"/>
