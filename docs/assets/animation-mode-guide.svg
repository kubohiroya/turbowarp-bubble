<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title description">
  <title id="title">Bubble animation mode比較</title>
  <desc id="description">talking、awaiting-continue、idleにおける目パチ、口パク、continue framesの動作比較。</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; }
    .heading { fill: #25283a; font-size: 28px; font-weight: 700; }
    .subheading { fill: #25283a; font-size: 20px; font-weight: 700; }
    .body { fill: #25283a; font-size: 16px; }
    .small { fill: #667085; font-size: 13px; }
    .block-text { fill: #ffffff; font-size: 13px; font-weight: 600; }
    .input-text { fill: #25283a; font-size: 13px; font-weight: 500; }
  </style>

  <rect width="1200" height="500" fill="#f2f4f8"/>
  <text x="32" y="47" class="heading">animation modeで表示中の動きを切り替える</text>
  <text x="32" y="72" class="small">緑は実行中、灰色は停止・非表示です。目パチはBubbleが表示されている間継続します。</text>
  <g>
    <rect x="24" y="86" width="360" height="382" rx="20" fill="#ffffff" stroke="#d9deea" stroke-width="2"/>
    <rect x="44" y="106" width="170" height="34" rx="17" fill="#e8ebf2"/>
    <text x="129" y="129" text-anchor="middle" style="fill:#25283a;font-size:15px;font-weight:700">talking</text>
    <text x="44" y="164" class="small">say／think直後</text>
    <g>
    <circle cx="100" cy="253" r="37.44" fill="#ffd5b5" stroke="#b85d63" stroke-width="2.88"/>
    <path d="M 65.44 236.44 Q 100 196.84 134.56 236.44 Q 118 219.16 100 228.52 Q 82 219.16 65.44 236.44" fill="#50354f"/>
    <ellipse cx="87.04" cy="244.36" rx="2.88" ry="5.04" fill="#3b2d3c"/>
       <ellipse cx="112.96" cy="244.36" rx="2.88" ry="5.04" fill="#3b2d3c"/>
    <ellipse cx="100" cy="267.4" rx="6.4799999999999995" ry="8.64" fill="#7c2945"/>
  </g>
    <g>
    <rect x="163" y="196" width="190" height="112" rx="28" fill="#fff4cc" stroke="#725a42" stroke-width="3"/>
    <path d="M 193 302 L 167 338 L 241 305 Z" fill="#fff4cc" stroke="#725a42" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 189 308 H 245" stroke="#fff4cc" stroke-width="8"/>
    <text x="199" y="266" style="fill:#25283a;font-size:17px;font-weight:700">海へ出発！</text>

  </g>
    <g transform="translate(0 0)">
          <circle cx="56" cy="355" r="7" fill="#20a464"/>
          <text x="74" y="361" class="body">目パチ</text>
          <text x="352" y="361" text-anchor="end" class="body" style="font-weight:700">実行</text>
        </g>
<g transform="translate(0 35)">
          <circle cx="56" cy="355" r="7" fill="#20a464"/>
          <text x="74" y="361" class="body">口パク</text>
          <text x="352" y="361" text-anchor="end" class="body" style="font-weight:700">実行</text>
        </g>
<g transform="translate(0 70)">
          <circle cx="56" cy="355" r="7" fill="#c7ccd8"/>
          <text x="74" y="361" class="body">次へ</text>
          <text x="352" y="361" text-anchor="end" class="body" style="font-weight:700">非表示</text>
        </g>
  </g>
  <g>
